<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--This video replaces the background image.-->
    <div class="video">
        <video autoplay muted loop id="myVideo">
        <source src="wave.mp4" type="video/mp4">
        </video>
    </div>
<!--All the visuals are inside the container-->
    <div class ="container">
        <h1 class="title">Pomodoro Timer</h1>
        <hr>
        <p class="timer" id="timer">01:30:00</p>
        <div class="button-wrapper">
            <input type="button" class="button" id="start" value="Start" onClick="startTimer();"/>
            <input type="button" class="button" id="stop" value="Stop" onClick="stopTimer();"/>
            <input type="button" class="button" id="reset" value="Reset" onClick="resetTimer();"/>
        </div>
        <!--Added the audio inside the container to organize everything easier-->
        <audio controls>
            <source src="Show Me.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <!--Song found in Youtube's Audio Library channel-->
        <p id="songTitle">Show Me - Peyruis | House music <br>Audio Library - Free Music</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
